name: Android Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # v5 y no v6, que es la mayor actual: la v6 saca el cacheado a un
      # componente propietario bajo los Terms of Use de Gradle, y usarla
      # implica aceptarlos. La v5 solo trae el salto a Node 24 —lo que hacía
      # falta— y sigue siendo MIT.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      # La firma se hace dentro de Gradle, no con una acción externa: el
      # build.gradle.kts lee estas credenciales y produce un APK ya firmado.
      - name: Preparar credenciales de firma
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > app/upload-keystore.jks
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "storeFile=app/upload-keystore.jks"
          } > key.properties

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de release
        run: ./gradlew assembleRelease

      # Se verifica la firma antes de publicar: un APK firmado con otra clave
      # no lo aceptarían como actualización las instalaciones existentes.
      - name: Verificar la firma del APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk nubo-release.apk

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: nubo-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Cambios en esta versión:
            ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Se hace con el CLI de gh, ya instalado en el runner, en vez de con una
      # acción de terceros: la que se usaba antes está sin mantenimiento desde
      # 2024 y seguía en el Node 20 que GitHub va a retirar.
      - name: Borrar releases antiguas (mantener las 3 últimas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                echo "Borrando release antigua: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
